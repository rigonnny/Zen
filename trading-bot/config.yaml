# ============================================================================
# Bot configuration — Phase 1: data pipeline.
#
# Everything the data pipeline needs to know lives here, so you can change
# WHAT to download without touching any Python code. Later phases will add
# their own sections (strategy rules, risk limits, ...) to this same file.
# ============================================================================

data:
  # Which markets to download. These are Binance USDT-M perpetual futures
  # symbols: "BTCUSDT" means the Bitcoin/US-Dollar-Tether perpetual contract.
  # Start with the two most liquid markets — liquid means lots of buyers and
  # sellers, so prices are cleaner and fees/slippage are lowest.
  symbols:
    - BTCUSDT
    - ETHUSDT

  # Candle sizes to download. A "4h" candle summarizes 4 hours of trading
  # into open/high/low/close prices + volume. We swing-trade on 4h and 1d,
  # matching the strategy we'll build in Phase 2.
  timeframes:
    - 4h
    - 1d

  # How far back to download, as a date (UTC). ~3 years gives the backtester
  # bull markets, bear markets and sideways chop to chew on — testing on only
  # a rising market would flatter any strategy.
  start_date: "2022-07-01"

  # Where the local SQLite database file goes (relative to this folder).
  # SQLite = a full database that lives in a single ordinary file. No server
  # to install; Python supports it out of the box.
  db_path: "data/market_data.db"

  # Also download funding-rate history. Perpetual futures never expire;
  # instead, every 8 hours longs and shorts pay each other a small "funding"
  # fee that keeps the contract price glued to the spot price. Over a
  # multi-day swing trade these payments add up, so an honest backtest
  # (Phase 3) must include them.
  fetch_funding_rates: true

strategy:
  # Phase 2: the strategy's tunable numbers. Full explanation of the rules
  # lives at the top of bot/strategy.py — short version: trade only in the
  # trend direction (EMA fast vs slow), enter when RSI crosses the midline,
  # stop-loss and take-profit placed as multiples of ATR.
  #
  # All values here are optional — anything omitted uses the defaults in
  # bot/strategy.py (shown below). A word of discipline: resist the urge to
  # twiddle these until a backtest looks great. That's called overfitting,
  # and it produces strategies that only work on the past.
  ema_fast: 50          # trend: "fast" average, in candles
  ema_slow: 200         # trend: "slow" average, in candles
  rsi_period: 14        # momentum lookback
  rsi_midline: 50.0     # the cross level that triggers entries
  atr_period: 14        # volatility lookback
  atr_stop_mult: 2.0    # stop-loss distance = 2.0 × ATR
  atr_target_mult: 3.0  # take-profit distance = 3.0 × ATR (→ 1.5:1 reward:risk)
  min_reward_risk: 1.5  # signals below this ratio are refused outright
  allow_shorts: true    # futures can profit from falls too; set false for long-only

backtest:
  # Phase 3: simulation settings. See bot/backtest.py for the full list of
  # honesty rules (next-open fills, worst-case tie-breaks, etc.).
  initial_equity: 10000     # starting pretend-money (USDT)
  fee_pct: 0.05             # Binance USDT-M taker fee per fill
  slippage_pct: 0.03        # adverse slippage per market-style fill
  risk_per_trade_pct: 1.0   # safety rule #3: % of equity risked per trade (max 2)
  max_leverage: 2.0         # safety rule #2: hard notional cap (max 3)

  # The overfitting tripwire. Data BEFORE this date is "in-sample" (the
  # period we look at while developing); data AFTER it is "out-of-sample" —
  # a sealed exam the strategy never saw during development. If results are
  # good in-sample but collapse out-of-sample, the strategy memorized the
  # past instead of learning something real, and we must NOT trade it.
  oos_start: "2025-07-01"
